openapi: 3.0.1
info:
    version: '~'
    title: '~'
    license:
        name: MIT
        url: https://github.com/l3tnun/EPGStation/blob/master/LICENSE

servers: []

paths: {}

components:
    schemas:
        UnixtimeMS:
            description: 時刻 (ms)
            type: integer

        ChannelId:
            description: 放送局 id
            type: integer
            maximum: 6553565535

        ServiceId:
            description: service id
            type: integer
            maximum: 6553565535

        NetworkId:
            description: network id
            type: integer
            maximum: 6553565535

        ProgramId:
            description: program id
            type: integer
            maximum: 655356553565535

        EventId:
            description: event id
            type: integer
            maximum: 655356553565535

        RuleId:
            description: ルール id
            type: integer

        UserId:
            description: ユーザー id
            type: integer

        ReserveId:
            description: 予約 id
            type: integer

        RecordedId:
            description: 録画済み番組 id
            type: integer

        RecordedHistoryId:
            description: 録画済み番組履歴管理 id
            type: integer

        VideoFileId:
            description: ビデオファイル id
            type: integer

        VideoFileType:
            description: ビデオファイル形式
            type: string
            enum:
                - 'ts'
                - 'encoded'

        ThumbnailId:
            description: サムネイル id
            type: integer

        DropLogFileId:
            description: ドロップログファイル id
            type: integer

        RecordedTagId:
            description: 録画 tag id
            type: integer

        EncodeId:
            description: エンコード id
            type: integer

        ChannelType:
            description: 放送波タイプ
            type: string
            enum:
                - GR
                - GR-ALT1
                - GR-ALT2
                - GR-ALT3
                - GR-ALT4
                - GR-ALT5
                - GR-ALT6
                - GR-ALT7
                - GR-ALT8
                - GR-ALT9
                - GR-ALT10
                - GR-ALT11
                - GR-ALT12
                - GR-ALT13
                - GR-ALT14
                - GR-ALT15
                - GR-ALT16
                - GR-ALT17
                - GR-ALT18
                - GR-ALT19
                - GR-ALT20
                - BS
                - CS
                - SKY

        ProgramGenreLv1:
            description: ジャンル
            type: integer

        ProgramGenreLv2:
            description: サブジャンル
            type: integer

        ProgramVideoType:
            description: 番組ビデオコーデック
            type: string
            enum:
                - mpeg2
                - h.264
                - h.265

        ProgramVideoResolution:
            description: 番組ビデオ解像度
            type: string
            enum:
                - 240p
                - 480i
                - 480p
                - 720p
                - 1080i
                - 1080p
                - 2160p
                - 4320p

        ProgramAudioSamplingRate:
            description: 番組オーディオサンプリングレート
            type: integer
            enum:
                - 16000 # 001
                - 22050 # 010
                - 24000 # 011
                - 32000 # 101
                - 44100 # 110
                - 48000 # 111

        StreamId:
            description: ストリーム id
            type: integer

        StreamType:
            description: ストリームの種類
            type: string
            enum:
                - LiveStream
                - LiveHLS
                - RecordedStream
                - RecordedHLS

        URLSchemeInfo:
            description: URL Scheme
            type: object
            properties:
                ios:
                    type: string
                android:
                    type: string
                mac:
                    type: string
                win:
                    type: string

        M2TSStreamParam:
            description: M2TS形式ストリーミングパラメータ
            type: object
            required:
                - name
                - isUnconverted
            properties:
                name:
                    description: 表示名
                    type: string
                isUnconverted:
                    description: 無変換か
                    type: boolean

        Config:
            description: コンフィグ
            type: object
            required:
                - socketIOPort
                - broadcast
                - recorded
                - encode
                - urlscheme
                - isEnableLiveStream
                - isEnableTSRecordedStream
                - isEnableEncodedRecordedStream
            properties:
                socketIOPort:
                    description: socket.io 通信で使用するポート
                    type: integer
                broadcast:
                    description: 有効な放送波情報
                    type: object
                    additionalProperties:
                        type: boolean
                    required:
                        - GR
                        - BS
                        - CS
                        - SKY
                    properties:
                        GR:
                            type: boolean
                        BS:
                            type: boolean
                        CS:
                            type: boolean
                        SKY:
                            type: boolean
                recorded:
                    description: 指定可能な録画ディレクトリ名
                    type: array
                    items:
                        type: string
                encode:
                    description: エンコードモード
                    type: array
                    items:
                        type: string
                urlscheme:
                    description: URL Scheme 情報
                    type: object
                    required:
                        - m2ts
                        - video
                        - download
                    properties:
                        m2ts:
                            $ref: '#/components/schemas/URLSchemeInfo'
                        video:
                            $ref: '#/components/schemas/URLSchemeInfo'
                        download:
                            $ref: '#/components/schemas/URLSchemeInfo'
                isEnableLiveStream:
                    description: ライブ視聴が有効か
                    type: boolean
                isEnableTSRecordedStream:
                    description: 録画済みの TS ファイルのストリーミングが有効か
                    type: boolean
                isEnableEncodedRecordedStream:
                    description: 録画済みのエンコード済みファイルのストリーミングが有効か
                    type: boolean
                developerMode:
                    description: 開発者向け設定を Web UI に表示する
                    type: boolean
                streamConfig:
                    description: ストリーミング設定
                    type: object
                    properties:
                        live:
                            description: ライブストリーミング設定
                            type: object
                            properties:
                                m2ts:
                                    description: ライブ M2TS ストリーミング設定
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/M2TSStreamParam'
                                m2tsll:
                                    description: ライブ M2TS Low Latency (mpegts.js 用) ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                webm:
                                    description: ライブ WebM ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                mp4:
                                    description: ライブ MP4 ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                hls:
                                    description: ライブ HLS ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                        recorded:
                            description: 録画済みストリーミング設定
                            type: object
                            properties:
                                ts:
                                    description: 録画済み TS ファイルのストリーミング設定
                                    type: object
                                    properties:
                                        m2tsll:
                                            description:
                                                録画済み TS ファイルの M2TS Low Latency (mpegts.js 用)
                                                ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        webm:
                                            description: 録画済み TS ファイルの WebM ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        mp4:
                                            description: 録画済み TS ファイルの MP4 ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        hls:
                                            description: 録画済み TS ファイルの HLS ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                encoded:
                                    description: 録画エンコード済みファイルのストリーミング設定
                                    type: object
                                    properties:
                                        webm:
                                            description: 録画エンコード済みファイルの WebM ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        mp4:
                                            description: 録画エンコード済みファイルの MP4 ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        hls:
                                            description: 録画エンコード済みファイルの HLS ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                watchConfig:
                    $ref: '#/components/schemas/WatchConfig'
                kodiHosts:
                    description: kodi hosts
                    type: array
                    items:
                        type: string

        WatchConfig:
            description: Web 視聴設定
            type: object
            required:
                - enabled
                - encoder
                - availableEncoders
                - liveQualities
                - recordedQualities
                - hevc10bit
                - fps24
            properties:
                enabled:
                    description: KonomiTV 方式の Web 視聴設定が有効か
                    type: boolean
                encoder:
                    description: Web 視聴に使用するエンコーダー
                    type: string
                    enum:
                        - FFmpeg
                        - QSVEncC
                        - NVEncC
                        - VCEEncC
                availableEncoders:
                    description: Web 視聴で選択可能なエンコーダー
                    type: array
                    items:
                        type: string
                        enum:
                            - FFmpeg
                            - QSVEncC
                            - NVEncC
                            - VCEEncC
                defaultLiveQuality:
                    description: ライブ視聴の標準画質
                    type: string
                defaultRecordedQuality:
                    description: 録画視聴の標準画質
                    type: string
                liveQualities:
                    description: ライブ視聴で選択可能な画質
                    type: array
                    items:
                        type: string
                recordedQualities:
                    description: 録画視聴で選択可能な画質
                    type: array
                    items:
                        type: string
                hevc10bit:
                    description: HEVC 10bit 出力を要求するか
                    type: boolean
                fps24:
                    description: 24fps モードを使用するか
                    type: boolean

        ChannelItems:
            type: array
            items:
                $ref: '#/components/schemas/ChannelItem'

        ChannelItem:
            description: チャンネル情報
            required:
                - id
                - serviceId
                - networkId
                - name
                - halfWidthName
                - remoteControlKeyId
                - hasLogoData
                - channelType
                - channel
            properties:
                id:
                    $ref: '#/components/schemas/ChannelId'
                serviceId:
                    $ref: '#/components/schemas/ServiceId'
                networkId:
                    $ref: '#/components/schemas/NetworkId'
                name:
                    description: 放送局名
                    type: string
                halfWidthName:
                    description: 放送局名(半角)
                    type: string
                hasLogoData:
                    description: ロゴデータを持っているか
                    type: boolean
                channelType:
                    $ref: '#/components/schemas/ChannelType'
                channel:
                    type: string
                type:
                    type: number

        ChannelJikkyoInfo:
            description: NX-Jikkyo実況接続情報
            type: object
            required:
                - jikkyoId
                - watchSessionUrl
                - commentSessionUrl
            properties:
                jikkyoId:
                    description: 実況チャンネルID
                    type: string
                    nullable: true
                watchSessionUrl:
                    description: 視聴セッションWebSocket URL
                    type: string
                    nullable: true
                commentSessionUrl:
                    description: コメントセッションWebSocket URL
                    type: string
                    nullable: true
                nicoliveWatchSessionError:
                    description: 本家ニコニコ実況への接続失敗理由
                    type: string
                    nullable: true
                canPost:
                    description: 現在の視聴者プロフィールでコメント投稿できるか
                    type: boolean
                postingTarget:
                    description: コメント投稿先
                    type: string
                    enum:
                        - nicolive
                        - nx-jikkyo
                    nullable: true

        ChannelJikkyoStatuses:
            description: 放送局ごとのNX-Jikkyo実況勢い
            type: array
            items:
                $ref: '#/components/schemas/ChannelJikkyoStatus'

        ChannelJikkyoStatus:
            description: 放送局のNX-Jikkyo実況勢い
            type: object
            required:
                - channelId
                - jikkyoId
                - force
            properties:
                channelId:
                    $ref: '#/components/schemas/ChannelId'
                jikkyoId:
                    description: 実況チャンネルID
                    type: string
                    nullable: true
                force:
                    description: 現在の実況勢い (コメント/分)
                    type: number
                    nullable: true

        RecordedJikkyoComment:
            description: 録画番組のNX-Jikkyo過去ログコメント
            type: object
            required:
                - id
                - time
                - text
                - color
                - position
                - size
                - userId
                - postedAt
            properties:
                id:
                    type: integer
                time:
                    description: 録画開始からの表示位置(秒)
                    type: number
                text:
                    type: string
                color:
                    type: string
                position:
                    type: string
                    enum: [top, right, bottom]
                size:
                    type: string
                    enum: [big, medium, small]
                userId:
                    type: string
                postedAt:
                    description: コメント投稿時刻(Unix time ms)
                    type: number

        RecordedJikkyoComments:
            description: 録画番組のNX-Jikkyo過去ログ取得結果
            type: object
            required:
                - isSuccess
                - comments
                - detail
            properties:
                isSuccess:
                    type: boolean
                comments:
                    type: array
                    items:
                        $ref: '#/components/schemas/RecordedJikkyoComment'
                detail:
                    type: string

        ScheduleChannleItem:
            description: 番組表の放送局データ
            required:
                - id
                - serviceId
                - networkId
                - name
                - hasLogoData
                - channelType
            properties:
                id:
                    $ref: '#/components/schemas/ChannelId'
                serviceId:
                    $ref: '#/components/schemas/ServiceId'
                networkId:
                    $ref: '#/components/schemas/NetworkId'
                name:
                    description: 放送局名
                    type: string
                remoteControlKeyId:
                    description: リモコン番号
                    type: integer
                hasLogoData:
                    description: ロゴデータを持っているか
                    type: boolean
                channelType:
                    $ref: '#/components/schemas/ChannelType'
                type:
                    type: number

        ScheduleProgramItem:
            description: 番組表の番組データ
            required:
                - id
                - channelId
                - startAt
                - endAt
                - isFree
                - name
            properties:
                id:
                    $ref: '#/components/schemas/ProgramId'
                channelId:
                    $ref: '#/components/schemas/ChannelId'
                startAt:
                    $ref: '#/components/schemas/UnixtimeMS'
                endAt:
                    $ref: '#/components/schemas/UnixtimeMS'
                isFree:
                    description: 無料放送か
                    type: boolean
                name:
                    description: 番組名
                    type: string
                description:
                    description: 番組詳細
                    type: string
                extended:
                    description: 番組拡張
                    type: string
                rawExtended:
                    description: 番組拡張 (Mirakurun の extended)
                    type: object
                genre1:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre1:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                genre2:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre2:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                genre3:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre3:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                videoType:
                    $ref: '#/components/schemas/ProgramVideoType'
                videoResolution:
                    $ref: '#/components/schemas/ProgramVideoResolution'
                videoStreamContent:
                    type: integer
                videoComponentType:
                    type: integer
                audioSamplingRate:
                    $ref: '#/components/schemas/ProgramAudioSamplingRate'
                audioComponentType:
                    type: integer

        ScheduleProgramItems:
            type: array
            items:
                $ref: '#/components/schemas/ScheduleProgramItem'

        Schedule:
            description: 番組表データ
            required:
                - channel
                - programs
            properties:
                channel:
                    $ref: '#/components/schemas/ScheduleChannleItem'
                programs:
                    $ref: '#/components/schemas/ScheduleProgramItems'

        Schedules:
            type: array
            items:
                $ref: '#/components/schemas/Schedule'

        ScheduleSearchOption:
            description: 番組検索オプション
            type: object
            required:
                - option
                - isHalfWidth
            properties:
                option:
                    $ref: '#/components/schemas/RuleSearchOption'
                isHalfWidth:
                    description: 半角文字で取得するか
                    type: boolean
                limit:
                    description: 検索結果取得最大件数
                    type: number

        Rules:
            description: ルール情報
            type: object
            required:
                - rules
                - total
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/Rule'
                total:
                    description: ルール総件数
                    type: integer

        Rule:
            description: ルール
            type: object
            required:
                - id
            properties:
                id:
                    $ref: '#/components/schemas/RuleId'
                reservesCnt:
                    description: 予約件数
                    type: integer
                annictId:
                    description: Annict経由で作成されたルールに紐づく作品ID
                    type: integer
            allOf:
                - $ref: '#/components/schemas/AddRuleOption'

        RuleKeywordItem:
            type: object
            required:
                - id
                - keyword
            properties:
                id:
                    $ref: '#/components/schemas/RuleId'
                keyword:
                    type: string

        RuleKeywordInfo:
            description: ルールキーワード検索結果
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleKeywordItem'

        User:
            description: ユーザー情報
            type: object
            required:
                - id
                - name
                - createdAt
            properties:
                id:
                    $ref: '#/components/schemas/UserId'
                name:
                    type: string
                createdAt:
                    $ref: '#/components/schemas/UnixtimeMS'

        Users:
            description: ユーザー一覧
            type: object
            required:
                - users
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'

        AddUserOption:
            description: ユーザー追加オプション
            type: object
            required:
                - name
            properties:
                name:
                    type: string

        UpdateUserOption:
            description: ユーザー更新オプション
            type: object
            required:
                - name
            properties:
                name:
                    type: string

        UpdateRecordedUserOption:
            description: 録画ユーザー更新オプション
            type: object
            required:
                - userId
            properties:
                userId:
                    $ref: '#/components/schemas/UserId'

        BulkUpdateRecordedUserOption:
            description: 録画ユーザー一括更新オプション
            type: object
            required:
                - recordedIds
                - userId
            properties:
                recordedIds:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/RecordedId'
                userId:
                    $ref: '#/components/schemas/UserId'

        MoveRecordedSubDirectoryOption:
            description: 録画ファイル一括サブディレクトリ移動オプション
            type: object
            required:
                - recordedIds
                - subDirectory
            properties:
                recordedIds:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/RecordedId'
                subDirectory:
                    type: string

        RecordedSubDirectories:
            description: 録画保存先に存在するサブディレクトリ
            type: object
            required:
                - directories
            properties:
                directories:
                    type: array
                    items:
                        type: string

        BulkRecordedOperationResult:
            description: 録画一括操作結果
            type: object
            required:
                - updatedCount
                - movedFileCount
            properties:
                updatedCount:
                    type: integer
                movedFileCount:
                    type: integer

        AddRuleOption:
            description: ルール追加プション
            type: object
            required:
                - isTimeSpecification
                - searchOption
                - reserveOption
            properties:
                isTimeSpecification:
                    description: 時刻指定予約か
                    type: boolean
                userId:
                    $ref: '#/components/schemas/UserId'
                searchOption:
                    $ref: '#/components/schemas/RuleSearchOption'
                reserveOption:
                    $ref: '#/components/schemas/RuleReserveOption'
                saveOption:
                    $ref: '#/components/schemas/ReserveSaveOption'
                encodeOption:
                    $ref: '#/components/schemas/ReserveEncodedOption'

        RuleSearchOption:
            description: ルール検索オプション
            type: object
            properties:
                keyword:
                    description: 検索キーワード
                    type: string
                ignoreKeyword:
                    description: 除外検索キーワード
                    type: string
                keyCS:
                    description: 大文字小文字区別有効化 (検索キーワード)
                    type: boolean
                keyRegExp:
                    description: 正規表現 (検索キーワード)
                    type: boolean
                name:
                    description: 番組名 (検索キーワード)
                    type: boolean
                description:
                    description: 概要 (検索キーワード)
                    type: boolean
                extended:
                    description: 詳細 (検索キーワード)
                    type: boolean
                ignoreKeyCS:
                    description: 大文字小文字区別有効化 (除外検索キーワード)
                    type: boolean
                ignoreKeyRegExp:
                    description: 正規表現 (除外検索キーワード)
                    type: boolean
                ignoreName:
                    description: 番組名 (除外検索キーワード)
                    type: boolean
                ignoreDescription:
                    description: 概要 (除外検索キーワード)
                    type: boolean
                ignoreExtended:
                    description: 詳細 (除外検索キーワード)
                    type: boolean
                GR:
                    description: GR
                    type: boolean
                BS:
                    description: BS
                    type: boolean
                CS:
                    description: CS
                    type: boolean
                SKY:
                    description: SKY
                    type: boolean
                channelTypes:
                    description: GR-ALT などの追加 channel type
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelType'
                channelIds:
                    description: 放送局
                    type: array
                    items:
                        $ref: '#/components/schemas/ChannelId'
                genres:
                    description: ジャンル
                    type: array
                    items:
                        $ref: '#/components/schemas/Genre'
                times:
                    description: 時刻範囲
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchTime'
                isFree:
                    description: 無料放送か
                    type: boolean
                durationMin:
                    description: 番組最小時間 (分)
                    type: integer
                durationMax:
                    description: 番組最大時間 (分)
                    type: integer
                searchPeriods:
                    description: 検索対象期間
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchPeriod'

        Genre:
            description: ジャンル設定
            type: object
            required:
                - genre
            properties:
                genre:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre:
                    $ref: '#/components/schemas/ProgramGenreLv2'

        SearchTime:
            description: 時刻範囲指定オプション
            type: object
            required:
                - week
            properties:
                start:
                    description:
